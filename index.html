<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mythic War — Gods, Titans &amp; Worshippers</title>
  <meta name="description" content="A browser real-time strategy game: lead worshippers, raise a city, and summon the gods, titans and mythical creatures of ten mythologies. Play co-op against AI or battle friends online.">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <!-- installable on a phone or tablet: home-screen icon, full screen, landscape (manifest.webmanifest) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d1126">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mythic War">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <!-- the game's own typefaces; the two the title screen uses first are fetched early so it never shows a stand-in font -->
  <link rel="preload" href="vendor/fonts/cinzel-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="src/ui/hud.css">
  <link rel="stylesheet" href="src/ui/intro.css">
  <script src="vendor/peerjs.min.js" defer></script>
  <noscript><style>#boot-text { display: none; }</style></noscript>
</head>
<body>
  <div id="app">
    <div id="game-root" hidden>
      <canvas id="game-canvas"></canvas>
      <div id="hud-root"></div>
    </div>
    <div id="menu-root"></div>
    <div id="boot-message"><span id="boot-text">Loading…</span><noscript>Mythic War needs JavaScript. Please turn it on and reload the page.</noscript></div>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
    // If the game never starts (a blocked or failed download, a browser too old for modules), say so instead of "Loading…" forever.
    setTimeout(function () {
      var t = document.getElementById('boot-text');
      if (t) t.textContent = 'Still loading… If nothing changes, reload the page (Ctrl+Shift+R). Mythic War needs a current desktop browser.';
    }, 12000);
  </script>
</body>
</html>
