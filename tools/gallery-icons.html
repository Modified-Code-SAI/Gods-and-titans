<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon gallery</title>
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../src/ui/hud.css">
<style>
  /* Every emoji the game names beside the painted icon that replaces it (src/ui/icon-map.js).
     Open through a static server: http://localhost:8080/tools/gallery-icons.html */
  html, body { height: auto !important; overflow: visible !important; position: static !important; }
  body { margin: 0; padding: 16px; background: #15110b; color: #e9dcc0; font: 13px/1.3 var(--mw-font-ui, sans-serif); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .cell { display: grid; grid-template-columns: 30px 34px 1fr; align-items: center; gap: 6px; padding: 5px 6px; border: 1px solid #4a3a22; border-radius: 4px; background: linear-gradient(#241b10, #17110a); }
  .emo { font: 22px/1 var(--mw-emoji); text-align: center; }
  .big { font-size: 26px; }
  .name { font-size: 11px; color: #b8a888; overflow-wrap: anywhere; }
  .row { margin: 14px 0 6px; display: flex; gap: 14px; align-items: center; font-size: 18px; }
</style>
</head>
<body>
<div class="row">Inline: <span>💰 400</span><span>🌲 200</span><span>✨ 50</span><span>👥 5/12</span><span>🏛️ Village</span><span>⚔️ Attack</span></div>
<div class="grid" id="grid"></div>
<script type="module">
  import { ICON_MAP } from '../src/ui/icon-map.js';
  import { watchIcons } from '../src/ui/icons.js';
  const grid = document.getElementById('grid');
  for (const [e, [name, tint]] of Object.entries(ICON_MAP)) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = `<span class="emo mw-noicons">${e}</span><span class="big">${e}</span><span class="name">${name}<br>${tint}</span>`;
    grid.appendChild(c);
  }
  watchIcons(document.body);
  document.body.dataset.ready = '1';
</script>
</body>
</html>
